<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Tutorials</title>

    <style>
      body {
        background-color: rgba(0, 0, 0, 0.8);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        font-family: monospace;
      }

      section {
        width: 100%;
        max-width: 100%;
      }

      canvas {
        display: block;
        margin: 0 auto;
        /* width: 100%;
        max-width: 100%; */
        background: #000;
        image-rendering: pixelated;
      }

      #gameContainer {
        text-align: center;
      }

      #gameCanvas {
        border: 3px solid;
      }

      #scoreText {
        font-size: 100px;
      }

      #resetBtn {
        font-size: 22px;
        width: 100px;
        height: 50px;
        border: 4px solid;
        border-radius: 15px;
        cursor: pointer;
      }
      
    </style>
  </head>
  <body>
    <section>
      <h1>Arcade Tutorials</h1>
    </section>

    <section id="gameContainer">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div id="scoreText">0 : 0</div>
      <button id="resetBtn">Reset</button>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
